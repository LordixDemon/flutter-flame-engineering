[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flutter-flame-knowledge"
version = "0.1.0"
description = "Versioned official Flutter, Dart and Flame sources, local search and an evidence graph"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ffkb = "flutter_kb.cli:main"

[tool.setuptools.packages.find]
include = ["flutter_kb*"]
